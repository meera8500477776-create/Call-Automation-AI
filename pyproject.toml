[project]
name = "config-driven-voice-agent"
version = "0.1.0"
description = "Production-grade, multi-tenant AI voice agent platform"
requires-python = ">=3.10"
dependencies = [
    "pipecat-ai>=0.0.40",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "twilio>=8.10.0",
    "deepgram-sdk>=7.19.0",
    "openai>=1.12.0",
    "elevenlabs>=0.2.27",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0.1",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "structlog>=24.1.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "watchdog>=3.0.0",
    "cryptography>=41.0.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
    "numpy>=1.24.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
audio = ["sounddevice>=0.4.6"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.92.0",
    "black>=23.12.0",
    "ruff>=0.1.9",
    "mypy>=1.8.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]  # Ignore line-too-long for now

[tool.ruff.lint.per-file-ignores]
"src/voice_agent/services/vllm_llm_service.py" = ["N801"]  # Allow vLLMLLMService class name

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = false
check_untyped_defs = false
