apiVersion: v1
kind: Secret
metadata:
  name: voice-agent-secrets
  namespace: voice-agent
type: Opaque
stringData:
  # Replace these with actual values or use external secret management
  deepgram_api_key: "YOUR_DEEPGRAM_API_KEY"
  openai_api_key: "YOUR_OPENAI_API_KEY"
  elevenlabs_api_key: "YOUR_ELEVENLABS_API_KEY"
  twilio_account_sid: "YOUR_TWILIO_ACCOUNT_SID"
  twilio_auth_token: "YOUR_TWILIO_AUTH_TOKEN"
  
  # FHIR OAuth credentials
  fhir_client_id: "YOUR_FHIR_CLIENT_ID"
  fhir_client_secret: "YOUR_FHIR_CLIENT_SECRET"
  
  # DMS API credentials
  dms_api_key: "YOUR_DMS_API_KEY"
