apiVersion: v1
kind: Service
metadata:
  name: voice-agent
  namespace: voice-agent
  labels:
    app: voice-agent
spec:
  type: LoadBalancer
  selector:
    app: voice-agent
  ports:
  - name: http
    port: 80
    targetPort: 8000
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
---
apiVersion: v1
kind: Service
metadata:
  name: voice-agent-gpu
  namespace: voice-agent
  labels:
    app: voice-agent-gpu
spec:
  type: ClusterIP
  selector:
    app: voice-agent-gpu
  ports:
  - name: http
    port: 8001
    targetPort: 8001
    protocol: TCP
